name: Fetch Docs Folders
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests pyyaml
      
      - name: Fetch docs from private repos
        env:
          GITHUB_PAT: ${{ secrets.ORG_READ_PAT }}
          GITHUB_ORG: DATAPACT  # ← CHANGE THIS TO YOUR ORG NAME
        run: python scripts/fetch_docs_folders.py
      
      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fetched-docs
          path: output/
