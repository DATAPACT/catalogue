<!DOCTYPE html>
<html>
<head>
  <title>Datapact Tools Catalogue</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: sans-serif; }

    body {
      display: flex;
      height: 100%;
      overflow: hidden;
    }

    /* Sidebar fixed on the left */
    .sidebar {
      width: 300px;
      background: #2c3e50;
      color: white;
      padding: 2rem;
      position: fixed;
      height: 100%;
      overflow-y: auto;
    }

    .sidebar h1 { margin-bottom: 2rem; }

    .home-btn {
      display: block;
      padding: 0.75rem 1rem 0.75rem 1.5rem;
      color: #3498db;
      background: #34495e;
      text-decoration: none;
      border-radius: 6px;
      margin-bottom: 1.5rem;
    }
    .home-btn:hover { background: #3498db; color: white; }

    .category { margin-bottom: 1.5rem; }
    .category h3 { color: #3498db; margin-bottom: 0.5rem; }

    .tool a {
      display: block;
      padding: 0.75rem 1rem 0.75rem 1.5rem;
      color: #bdc3c7;
      text-decoration: none;
      border-radius: 6px;
      transition: all 0.3s;
      position: relative;
    }
    .tool a:hover, .tool a.active { background: #3498db; color: white; }

    /* Main content to the right of fixed sidebar */
    .main {
      margin-left: 300px; /* same as sidebar width */
      padding: 2rem;
      background: #f5f5f5;
      height: 100%;
      overflow-y: auto;
    }

    #main-content { min-height: 70vh; }
  </style>
</head>
