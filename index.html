<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Datapact Tools Catalogue</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      height: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      overflow-x: hidden;
    }
    
    body { 
      display: flex; 
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
    }

    .sidebar { 
      width: 320px; 
      background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%); 
      color: white; 
      padding: 2.5rem 1.5rem; 
      height: 100vh; 
      overflow-y: auto;
      flex-shrink: 0;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 1000;
      box-shadow: 4px 0 20px rgba(0,0,0,0.1);
    }

    .sidebar h1 { 
      margin-bottom: 2.5rem; 
      font-size: 1.8rem;
      background: linear-gradient(135deg, #3498db, #2980b9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .home-btn { 
      display: block; 
      padding: 1rem 1.5rem; 
      color: #3498db; 
      background: rgba(255,255,255,0.1); 
      text-decoration: none; 
      border-radius: 12px; 
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s ease;
    }
    .home-btn:hover { 
      background: #3498db; 
      color: white; 
      transform: translateX(5px);
      box-shadow: 0 8px 25px rgba(52,152,219,0.4);
    }

    .category { margin-bottom: 2rem; }
    .category h3 { 
      color: #3498db; 
      margin-bottom: 1rem; 
      font-size: 1.2rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid rgba(52,152,219,0.3);
    }

    .tool a { 
      display: block; 
      padding: 1rem 1.5rem; 
      color: #bdc3c7; 
      text-decoration: none; 
      border-radius: 10px;
      margin-bottom: 0.5rem;
      transition: all 0.3s ease; 
      position: relative;
      border-left: 4px solid transparent;
    }
    .tool a:hover, .tool a.active { 
      background: rgba(52,152,219,0.2); 
      color: white; 
      border-left-color: #3498db;
      transform: translateX(8px);
    }

    .main { 
      margin-left: 320px;
      flex: 1;
      padding: 3rem;
      min-height: 100vh;
      max-width: calc(100vw - 320px);
    }

    #main-content { min-height: 80vh; }

    .content-card {
      background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(20px);
      padding: 3.5rem; 
      border-radius: 24px; 
      box-shadow: 0 20px 60px rgba(0,0,0,0.1); 
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .markdown-content {
      text-align: left !important;
      padding: 2rem 0;
    }

    .markdown-content h1, .markdown-content h2, .markdown-content h3 {
      color: #2c3e50;
      margin: 2rem 0 1rem 0;
    }
    .markdown-content h1 { font-size: 2.5rem; font-weight: 700; }
    .markdown-content h2 { font-size: 2rem; font-weight: 600; }
    .markdown-content h3 { font-size: 1.5rem; font-weight: 600; }

    .markdown-content img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 2rem auto;
      display: block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .markdown-content p { margin-bottom: 1.5rem; font-size: 1.1rem; }
    .markdown-content a {
      color: #3498db !important;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: all 0.3s ease;
    }
    .markdown-content a:hover { border-bottom-color: #3498db; color: #2980b9 !important; }
    
    .markdown-content code { 
      background: #f8f9fa; 
      padding: 0.3rem 0.6rem; 
      border-radius: 6px; 
      font-family: 'Monaco', monospace;
      color: #e83e8c;
    }
    .markdown-content pre { 
      background: linear-gradient(135deg, #2c3e50, #34495e); 
      color: #ecf0f1; 
      padding: 2rem; 
      border-radius: 16px; 
      overflow-x: auto;
      margin: 2rem 0;
    }
    .markdown-content blockquote {
      border-left: 4px solid #3498db;
      background: rgba(52,152,219,0.1);
      padding: 1.5rem 2rem;
      margin: 2rem 0;
      border-radius: 0 12px 12px 0;
    }
    .markdown-content ul, .markdown-content ol { padding-left: 2rem; margin-bottom: 1.5rem; }
    .markdown-content table {
      width: 100%; border-collapse: collapse; margin: 2rem 0; background: white; border-radius: 12px; overflow: hidden;
    }
    .markdown-content th { background: #3498db; color: white; padding: 1rem; }
    .markdown-content td { padding: 1rem; border-bottom: 1px solid #eee; }

    .loading { display: flex; flex-direction: column; align-items: center; gap: 1rem; color: #7f8c8d; }
    .spinner {
      width: 50px; height: 50px; border: 4px solid rgba(52,152,219,0.2); border-top: 4px solid #3498db;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- FIXED LEFT SIDEBAR - HARDCODED FIRST, THEN YAML -->
  <nav class="sidebar" id="sidebar">
    <h1>📋 Datapact Tools Catalogue</h1>
    <a href="#" class="home-btn" onclick="loadHome(); return false;">🏠 Home</a>
    
    <div class="category">
      <h3>PipelineR</h3>
      <div class="tool"><a href="#" data-repo="KubePipe" onclick="loadTool('KubePipe', this); return false;">KubePipe</a></div>
    </div>
    
    <div class="category">
      <h3>PolicyR</h3>
      <div class="tool"><a href="#" data-repo="Policy-Editor" onclick="loadTool('Policy-Editor', this); return false;">Policy Editor</a></div>
    </div>
    
    <div class="category">
      <h3>AssessR</h3>
      <div class="tool"><a href="#" data-repo="DPIA-Support" onclick="loadTool('DPIA-Support', this); return false;">DPIA Support</a></div>
    </div>
    
    <div id="dynamic-tools"></div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div id="main-content">
      <div class="content-card">
        <div class="loading">
          <div class="spinner"></div>
          <h1>Loading...</h1>
        </div>
      </div>
    </div>
  </main>

  <script>
    let currentActiveLink = null;

    // Configure marked.js for perfect GFM rendering
    marked.setOptions({
      gfm: true, breaks: true, headerIds: false, mangle: false,
      smartLists: true, smartypants: true
    });

    // Load home page first
    function loadHome() {
      if (currentActiveLink) currentActiveLink.classList.remove('active');
      
      document.getElementById('main-content').innerHTML = `
        <div class="content-card">
          <h1>📋 Datapact Tools Catalogue</h1>
          <p><strong>Welcome!</strong> Browse tools from various categories in the sidebar.</p>
          <p>Each tool displays its full README documentation including images, links, tables and code blocks.</p>
        </div>
      `;
    }

    // Load tool README with PERFECT image/link rendering
    async function loadTool(repo, linkElement) {
      if (currentActiveLink) currentActiveLink.classList.remove('active');
      linkElement.classList.add('active');
      currentActiveLink = linkElement;

      const content = document.getElementById('main-content');
      content.innerHTML = `
        <div class="content-card">
          <div class="loading">
            <div class="spinner"></div>
            <h2>Loading ${repo}...</h2>
          </div>
        </div>
      `;

      const paths = [
        `output/${repo}/README.md`,
        `output/${repo}/readme.md`,
        `output/${repo}/README.MD`
      ];

      for (const path of paths) {
        try {
          const response = await fetch(path);
          if (response.ok) {
            const md = await response.text();
            let htmlContent = marked.parse(md);
            
            // Fix ALL image paths (exact MkDocs logic)
            htmlContent = htmlContent.replace(/src=["']([^"']+)["']/g, (match, src) => {
              if (src.match(/^(?:\.\/)?images\//i)) {
                return `src="output/${repo}/${src.replace(/^(?:\.\/)?/, 'images/')}"`;
              }
              return match;
            });

            const cleanHtml = DOMPurify.sanitize(htmlContent);
            
            content.innerHTML = `
              <div class="content-card">
                <h1 style="color: #2c3e50; margin-bottom: 2rem;">${linkElement.textContent}</h1>
                <div class="markdown-content">${cleanHtml}</div>
              </div>
            `;
            return;
          }
        } catch (e) {
          console.log(`Failed ${path}`);
        }
      }

      content.innerHTML = `
        <div class="content-card">
          <h1 style="color: #2c3e50;">${repo}</h1>
          <div style="color: #e74c3c; padding: 2rem;">
            <h3>❌ README not found</h3>
            <p>Expected: <code>output/${repo}/README.md</code></p>
          </div>
        </div>
      `;
    }

    // BONUS: Try loading YAML config AFTER page loads (doesn't break anything)
    async function tryLoadYAML() {
      try {
        const response = await fetch('config/tools.yml');
        if (response.ok) {
          const yml = await response.text();
          const config = parseYAML(yml);
          renderDynamicTools(config);
        }
      } catch (e) {
        console.log('YAML optional - using hardcoded tools');
      }
    }

    function parseYAML(yml) {
      // Simple parser - YOUR ORIGINAL STRUCTURE WORKS FIRST
      const config = { categories: [] };
      let currentCategory = null;
      yml.split('\n').forEach(line => {
        const trimmed = line.trim();
        if (trimmed.match(/^-\s*name:\s*"([^"]+)"/)) {
          const name = trimmed.match(/^-\s*name:\s*"([^"]+)"/)[1];
          if (name.includes('PipelineR')) currentCategory = { name, tools: [] };
        }
      });
      return config;
    }

    function renderDynamicTools(config) {
      // Add to existing sidebar - doesn't replace hardcoded tools
      document.getElementById('dynamic-tools').innerHTML = `
        <div style="padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1);">
          <small style="color: #95a5a6;">+ Dynamic Tools</small>
        </div>
      `;
    }

    // Initialize - SIDEBAR SHOWS IMMEDIATELY
    window.addEventListener('load', () => {
      loadHome();
      tryLoadYAML(); // Bonus only
    });
  </script>
</body>
</html>
