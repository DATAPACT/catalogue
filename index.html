<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Datapact Tools Catalogue</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; font-family:sans-serif; }
    body { display:flex; height:100%; overflow:hidden; }

    .sidebar { width:250px; background:#2c3e50; color:white; padding:1rem; overflow-y:auto; flex-shrink:0; }
    .sidebar h1 { margin-bottom:1rem; }
    .category { margin-bottom:1rem; }
    .category h3 { color:#3498db; margin-bottom:0.5rem; }
    .tool a { display:block; padding:0.3rem 0.5rem; color:#bdc3c7; text-decoration:none; border-radius:4px; }
    .tool a:hover, .tool a.active { background:#3498db; color:white; }

    .main { flex:1; padding:1rem; background:#f5f5f5; height:100%; overflow-y:auto; }
  </style>
</head>
<body>

  <div class="sidebar">
    <h1>Catalogue</h1>
    <div id="menu"></div>
  </div>

  <div class="main" id="main-content"></div>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script>
    const menuDiv = document.getElementById("menu");
    const mainDiv = document.getElementById("main-content");

    fetch('./config/tools.yml')
      .then(r => r.text())
      .then(yamlText => {
        const config = jsyaml.load(yamlText);
        buildMenu(config);
        loadHome();
      })
