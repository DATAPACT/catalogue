<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Datapact Tools Catalogue</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    :root {
      --primary-color: #3498db;
      --dark-bg: #2c3e50;
      --card-bg: rgba(255,255,255,0.95);
      --text-dark: #2c3e50;
      --text-light: #7f8c8d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      height: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      overflow-x: hidden;
      line-height: 1.6;
    }
    
    body { 
      display: flex; 
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
    }

    .sidebar { 
      width: 320px; 
      background: linear-gradient(180deg, var(--dark-bg) 0%, #1a252f 100%); 
      color: white; 
      padding: 2.5rem 1.5rem; 
      height: 100vh; 
      overflow-y: auto;
      flex-shrink: 0;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 1000;
      box-shadow: 4px 0 20px rgba(0,0,0,0.1);
    }

    .sidebar h1 { 
      margin-bottom: 2.5rem; 
      font-size: 1.8rem;
      background: linear-gradient(135deg, var(--primary-color), #2980b9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .home-btn { 
      display: block; 
      padding: 1rem 1.5rem; 
      color: var(--primary-color); 
      background: rgba(255,255,255,0.1); 
      text-decoration: none; 
      border-radius: 12px; 
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s ease;
    }
    .home-btn:hover { 
      background: var(--primary-color); 
      color: white; 
      transform: translateX(5px);
      box-shadow: 0 8px 25px rgba(52,152,219,0.4);
    }

    .category { margin-bottom: 2rem; }
    .category h3 { 
      color: var(--primary-color); 
      margin-bottom: 1rem; 
      font-size: 1.2rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid rgba(52,152,219,0.3);
    }

    .tool a { 
      display: block; 
      padding: 1rem 1.5rem; 
      color: #bdc3c7; 
      text-decoration: none; 
      border-radius: 10px;
      margin-bottom: 0.5rem;
      transition: all 0.3s ease; 
      position: relative;
      border-left: 4px solid transparent;
    }
    .tool a:hover, .tool a.active { 
      background: rgba(52,152,219,0.2); 
      color: white; 
      border-left-color: var(--primary-color);
      transform: translateX(8px);
    }

    .main { 
      margin-left: 320px;
      flex: 1;
      padding: 3rem;
      min-height: 100vh;
      max-width: calc(100vw - 320px);
    }

    #main-content { min-height: 80vh; }

    .content-card {
      background: var(--card-bg); 
      backdrop-filter: blur(20px);
      padding: 3.5rem; 
      border-radius: 24px; 
      box-shadow: 0 20px 60px rgba(0,0,0,0.1); 
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.4s ease;
    }

    .markdown-content {
      text-align: left !important;
      padding: 2rem 0;
    }

    .markdown-content h1, .markdown-content h2, .markdown-content h3,
    .markdown-content h4, .markdown-content h5, .markdown-content h6 {
      color: var(--text-dark);
      margin: 2rem 0 1rem 0;
      scroll-margin-top: 4rem;
    }

    .markdown-content h1 { font-size: 2.5rem; font-weight: 700; }
    .markdown-content h2 { font-size: 2rem; font-weight: 600; }
    .markdown-content h3 { font-size: 1.5rem; font-weight: 600; }

    .markdown-content img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 2rem auto;
      display: block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .markdown-content p { 
      margin-bottom: 1.5rem; 
      font-size: 1.1rem;
    }
    
    .markdown-content a {
      color: var(--primary-color) !important;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: all 0.3s ease;
      word-break: break-word;
    }
    
    .markdown-content a:hover {
      border-bottom-color: var(--primary-color);
      color: #2980b9 !important;
    }

    .markdown-content code { 
      background: #f8f9fa; 
      padding: 0.3rem 0.6rem; 
      border-radius: 6px; 
      font-family: 'Monaco', 'Menlo', monospace;
      color: #e83e8c;
    }
    
    .markdown-content pre { 
      background: linear-gradient(135deg, #2c3e50, #34495e); 
      color: #ecf0f1; 
      padding: 2rem; 
      border-radius: 16px; 
      overflow-x: auto;
      margin: 2rem 0;
      position: relative;
    }
    
    .markdown-content pre code {
      background: none;
      padding: 0;
      color: inherit;
    }

    .markdown-content blockquote {
      border-left: 4px solid var(--primary-color);
      background: rgba(52,152,219,0.1);
      padding: 1.5rem 2rem;
      margin: 2rem 0;
      border-radius: 0 12px 12px 0;
      font-style: italic;
    }
    
    .markdown-content ul, .markdown-content ol { 
      padding-left: 2rem; 
      margin-bottom: 1.5rem;
    }
    
    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 2rem 0;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    
    .markdown-content th, .markdown-content td {
      padding: 1rem 1.5rem;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    
    .markdown-content th {
      background: var(--primary-color);
      color: white;
      font-weight: 600;
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      color: var(--text-light);
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(52,152,219,0.2);
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); position: absolute; }
      .main { margin-left: 0; }
    }
  </style>
</head>
<body>
  <!-- FIXED LEFT SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <h1>📋 Datapact Tools</h1>
    <a href="#" class="home-btn" onclick="loadHome(); return false;">🏠 Home</a>
    
    <div id="tools-menu">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading tools...</p>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div id="main-content">
      <div class="content-card">
        <div class="loading">
          <div class="spinner"></div>
          <h1>Loading...</h1>
        </div>
      </div>
    </div>
  </main>

  <script>
    let toolsConfig = null;
    let currentActiveLink = null;

    // Configure marked.js EXACTLY like MkDocs (GFM + full feature set)
    marked.setOptions({
      gfm: true,
      breaks: true,
      headerIds: false,
      mangle: false,
      smartLists: true,
      smartypants: true
    });

    // Load tools configuration and populate sidebar
    async function loadToolsConfig() {
      try {
        const response = await fetch('config/tools.yml');
        if (!response.ok) throw new Error('tools.yml not found');
        
        const ymlText = await response.text();
        toolsConfig = parseYAML(ymlText);
        
        renderSidebar(toolsConfig);
      } catch (error) {
        console.error('Failed to load tools.yml:', error);
        // Fallback to hardcoded structure like your original
        toolsConfig = {
          categories: [
            { name: "PipelineR", tools: [{name: "KubePipe", repo: "KubePipe"}] },
            { name: "PolicyR", tools: [{name: "Policy Editor", repo: "Policy-Editor"}] },
            { name: "AssessR", tools: [{name: "DPIA Support", repo: "DPIA-Support"}] }
          ]
        };
        renderSidebar(toolsConfig);
      }
    }

    // Robust YAML parser
    function parseYAML(yml) {
      const lines = yml.split('\n');
      const config = { categories: [] };
      let currentCategory = null;

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;

        // Category: - name: "PipelineR"
        const categoryMatch = trimmed.match(/^-\s*name:\s*"([^"]+)"/);
        if (categoryMatch) {
          currentCategory = { name: categoryMatch[1], tools: [] };
          config.categories.push(currentCategory);
          continue;
        }

        // Tool: - name: "KubePipe"
        if (currentCategory) {
          const toolMatch = trimmed.match(/^-\s*name:\s*"([^"]+)"/);
          if (toolMatch) {
            const toolName = toolMatch[1];
            currentCategory.tools.push({ 
              name: toolName, 
              repo: toolName.replace(/[^a-zA-Z0-9-]/g, '-') 
            });
          }
        }
      }
      return config;
    }

    // Render sidebar
    function renderSidebar(config) {
      let html = '';
      config.categories.forEach(category => {
        html += `
          <div class="category">
            <h3>${category.name}</h3>
            ${category.tools.map(tool => `
              <div class="tool">
                <a href="#" data-repo="${tool.repo}" onclick="loadTool('${tool.repo}', this); return false;">
                  ${tool.name}
                </a>
              </div>
            `).join('')}
          </div>
        `;
      });
      document.getElementById('tools-menu').innerHTML = html;
    }

    // Load home page
    async function loadHome() {
      if (currentActiveLink) currentActiveLink.classList.remove('active');
      
      try {
        const response = await fetch('home.html');
        if (response.ok) {
          const html = await response.text();
          document.getElementById('main-content').innerHTML = html;
          return;
        }
      } catch (e) {
        console.log('home.html not found, showing default home');
      }

      document.getElementById('main-content').innerHTML = `
        <div class="content-card">
          <h1>📋 Datapact Tools Catalogue</h1>
          <p><strong>Welcome!</strong> Browse tools from various categories in the sidebar.</p>
          <p>Each tool displays its full README documentation including images, links, tables and code blocks.</p>
          <div style="margin-top: 2rem; font-size: 0.9rem; color: var(--text-light);">
            <p><strong>💡 Tip:</strong> Refresh (F5) after editing README.md files to see changes instantly.</p>
          </div>
        </div>
      `;
    }

    // CRITICAL: Load tool README with MkDocs-exact image/link handling
    async function loadTool(repo, linkElement) {
      if (currentActiveLink) currentActiveLink.classList.remove('active');
      linkElement.classList.add('active');
      currentActiveLink = linkElement;

      const content = document.getElementById('main-content');
      content.innerHTML = `
        <div class="content-card">
          <div class="loading">
            <div class="spinner"></div>
            <h2>Loading ${repo}...</h2>
          </div>
        </div>
      `;

      const paths = [
        `output/${repo}/README.md`,
        `output/${repo}/readme.md`,
        `output/${repo}/README.MD`
      ];

      for (const path of paths) {
        try {
          const response = await fetch(path);
          if (response.ok) {
            const md = await response.text();
            
            // Render with marked.js (GFM full support)
            let htmlContent = marked.parse(md);
            
            // CRITICAL: Fix ALL image paths (DS2/MkDocs style)
            htmlContent = htmlContent.replace(/src=["']([^"']+)["']/g, (match, src) => {
              // Case 1: images/ folder (your structure)
              if (src.startsWith('images/')) {
                return `src="output/${repo}/${src}"`;
              }
              // Case 2: ./images/ or images/ relative
              if (src.match(/^\.?\/?images\//)) {
                return `src="output/${repo}/images/${src.replace(/^\.?\/?/, '')}"`;
              }
              // Case 3: Absolute paths - leave as-is
              return match;
            });

            // Sanitize HTML (like MkDocs does)
            const cleanHtml = DOMPurify.sanitize(htmlContent);

            content.innerHTML = `
              <div class="content-card">
                <h1 style="color: var(--text-dark); margin-bottom: 2rem;">${linkElement.textContent}</h1>
                <div class="markdown-content">${cleanHtml}</div>
              </div>
            `;
            
            // Scroll to top smoothly
            content.scrollIntoView({ behavior: 'smooth' });
            return;
          }
        } catch (e) {
          console.log(`Failed to load ${path}:`, e);
        }
      }

      // Detailed error
      content.innerHTML = `
        <div class="content-card">
          <h1 style="color: var(--text-dark);">${repo}</h1>
          <div style="color: #e74c3c; padding: 2rem; text-align: left;">
            <h3>❌ README not found</h3>
            <p>Expected structure:</p>
            <pre style="background: #f8f9fa; padding: 1rem; border-radius: 8px; font-size: 0.9rem;">
DATAPACT/catalogue/output/${repo}/
├── README.md
└── images/
    └── *.png
            </pre>
            <p><strong>Checked:</strong> ${paths.join(', ')}</p>
          </div>
        </div>
      `;
    }

    // Initialize
    window.addEventListener('load', () => {
      loadToolsConfig();
      loadHome();
    });

    // Keyboard: ESC = Home
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') loadHome();
    });
  </script>
</body>
</html>
