<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tools Catalogue</title>
<style>
  body {
    font-family: sans-serif;
    margin: 0;
    display: flex;
  }
  #sidebar {
    width: 250px;
    background-color: #f5f5f5;
    padding: 20px;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    height: 100vh;
    overflow-y: auto;
  }
  #main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }
  ul { list-style: none; padding-left: 0; }
  .category > span { 
    font-weight: bold; 
    margin-top: 10px; 
    display: block; 
  }
  .tool { 
    margin-left: 15px; 
  }
  .tool a { 
    text-decoration: none; 
    color: #333; 
    cursor: pointer; 
    display: block;
    padding: 5px 0;
  }
  .tool a:hover { 
    text-decoration: underline; 
    color: #0070f3; 
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>Tools</h2>
  <nav id="tools-menu"></nav>
</div>

<div id="main">
  <h1>Tools Catalogue</h1>
  <p>Select a tool from the sidebar to see its README.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script>
async function loadConfig() {
  const response = await fetch("config/tools.yml");
  if (!response.ok) throw new Error("Could not fetch tools.yml");
  const yamlText = await response.text();
  return jsyaml.load(yamlText);
}

function buildMenuData(config) {
  const categories = config.categories || [];
  const tools = config.tools || [];
  const catMap = new Map();
  
  categories.forEach(cat => catMap.set(cat, []));
  
  tools.forEach(tool => {
    if (!tool.repo || !tool.mainfile) return;
    const cat = tool.category || "Uncategorized";
    if (!catMap.has(cat)) catMap.set(cat, []);
    
    catMap.get(cat).push({
      name: tool.name || tool.repo,
      repo: tool.repo,
      readmePath: `output/${tool.repo}/${tool.mainfile}`
    });
  });

  return categories.map(category => ({
    category,
    tools: catMap.get(category) || []
  })).filter(({tools}) => tools.length > 0);
}

function renderMenu(menuData) {
  const container = document.getElementById("tools-menu");
  container.innerHTML = "";
  
  const ul = document.createElement("ul");

  menuData.forEach(({ category, tools }) => {
    if (tools.length === 0) return;
    
    const catLi = document.createElement("li");
    catLi.className = "category";

    const title = document.createElement("span");
    title.textContent = category;
    catLi.appendChild(title);

    const subUl = document.createElement("ul");
    
    tools.forEach(tool => {
      const toolLi = document.createElement("li");
      toolLi.className = "tool";

      const link = document.createElement("a");
      link.href = "#";
      link.textContent = tool.name;
      link.dataset.repo = tool.repo;
      
      // ✅ FIXED: Capture variables in closure - NO 'this' context issues
      link.addEventListener("click", async (e) => {
        e.preventDefault();
        const main = document.getElementById("main");
        const repo = tool.repo;  // ✅ Use captured tool.repo directly
        const readmePath = tool.readmePath;
        const toolName = tool.name;
        
        main.innerHTML = `<h2>Loading ${toolName}...</h2>`;
        
        try {
          const resp = await fetch(readmePath);
          if (resp.ok) {
            let html = await resp.text();
            
            // 🎯 IMAGE PATH FIX - Direct repo access
            html = html.replace(/src=["']([^"']+)["']/g, (match, src) => {
              if (src.startsWith('./images/')) {
                const filename = src.replace('./images/', '');
                return `src="output/${repo}/images/${filename}"`;
              }
              if (src.startsWith('images/')) {
                const filename = src.replace('images/', '');
                return `src="output/${repo}/images/${filename}"`;
              }
              return match;
            });
            
            main.innerHTML = html;
          } else {
            main.innerHTML = `
              <h2>${toolName}</h2>
              <p>Tool not loaded. README not found: ${readmePath}</p>
            `;
          }
        } catch (err) {
          main.innerHTML = `
            <h2>${toolName}</h2>
            <p>Error loading tool: ${err.message}</p>
          `;
        }
      });

      toolLi.appendChild(link);
      subUl.appendChild(toolLi);
    });
    
    catLi.appendChild(subUl);
    ul.appendChild(catLi);
  });
  
  container.appendChild(ul);
}

// Initialize
(async function() {
  try {
    const config = await loadConfig();
    const menuData = buildMenuData(config);
    renderMenu(menuData);
  } catch (err) {
    document.getElementById("main").innerHTML = `<p>Error: ${err.message}</p>`;
  }
})();
</script>
</body>
</html>
