<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tools Catalogue</title>
<style>
  body {
    font-family: sans-serif;
    margin: 0;
    display: flex;
  }
  #sidebar {
    width: 250px;
    background-color: #f5f5f5;
    padding: 20px;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    height: 100vh;
    overflow-y: auto;
  }
  #main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }
  ul { list-style: none; padding-left: 0; }
  .category > span { 
    font-weight: bold; 
    margin-top: 10px; 
    display: block; 
  }
  .tool { 
    margin-left: 15px; 
  }
  .tool a { 
    text-decoration: none; 
    color: #333; 
    cursor: pointer; 
    display: block;
    padding: 5px 0;
  }
  .tool a:hover { 
    text-decoration: underline; 
    color: #0070f3; 
  }
</style>
</head>

  <h2>Tools</h2>
  <nav id="tools-menu"></nav>
</div>

<div id="main">
  <h1>Tools Catalogue</h1>
  <p>Select a tool from the sidebar to see its README.</p>
</div>

  const response = await fetch("config/tools.yml");

  const yamlText = await response.text();
  return jsyaml.load(yamlText);
}
