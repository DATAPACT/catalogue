<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #f7f7f7; stroke: #333333; stroke-width: 2; }
      .title { font: 18px Arial, sans-serif; fill: #111111; }
      .text { font: 14px Arial, sans-serif; fill: #111111; }
      .arrow { stroke: #333333; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333" />
    </marker>
  </defs>

  <text x="24" y="32" class="title">Lion-Linker (Placeholder Architecture)</text>

  <rect x="40" y="80" width="220" height="80" class="box" />
  <text x="60" y="115" class="text">Tabular Input</text>
  <text x="60" y="138" class="text">(CSV / DataFrame)</text>

  <rect x="340" y="80" width="220" height="80" class="box" />
  <text x="360" y="115" class="text">Candidate Retrieval</text>
  <text x="360" y="138" class="text">(KB / Service)</text>

  <rect x="640" y="80" width="220" height="80" class="box" />
  <text x="660" y="115" class="text">LLM Ranking</text>
  <text x="660" y="138" class="text">(Top-k Entities)</text>

  <rect x="340" y="250" width="220" height="80" class="box" />
  <text x="360" y="285" class="text">Linked Output</text>
  <text x="360" y="308" class="text">(Enriched Table)</text>

  <line x1="260" y1="120" x2="340" y2="120" class="arrow" />
  <line x1="560" y1="120" x2="640" y2="120" class="arrow" />
  <line x1="750" y1="160" x2="450" y2="250" class="arrow" />
</svg>
