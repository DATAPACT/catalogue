<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tools Menu</title>
<style>
  body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; }
  #sidebar { width: 220px; background: #f5f5f5; padding: 15px; overflow-y: auto; border-right: 1px solid #ddd; }
  #sidebar ul { list-style: none; padding-left: 0; }
  .category > span { font-weight: bold; display: block; margin-top: 15px; }
  .tool { margin-left: 15px; }
</style>
</head>
<body>

<nav id="sidebar"></nav>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script>
(async function() {
  const res = await fetch("./config/tools.yml");
  const text = await res.text();
  const config = jsyaml.load(text);

  const categories = config.categories || [];
  const tools = config.tools || [];
  const catMap = new Map(categories.map(c => [c, []]));

  tools.forEach(t => {
    if (catMap.has(t.category)) catMap.get(t.category).push(t.name || t.repo);
  });

  const sidebar = document.getElementById("sidebar");
  const ul = document.createElement("ul");

  catMap.forEach((toolNames, category) => {
    const catLi = document.createElement("li");
    catLi.className = "category";
    const span = document.createElement("span");
    span.textContent = category;
    catLi.appendChild(span);

    const subUl = document.createElement("ul");
