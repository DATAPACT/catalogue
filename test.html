  }
  #sidebar a {
    text-decoration: none;
    color: #333;
  }
  #sidebar a:hover {
    text-decoration: underline;
  }

  /* Main content */
  #content {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>

async function loadConfig() {
  const response = await fetch("config/tools.yml");
  const yamlText = await response.text();
  return jsyaml.load(yamlText);
}

function buildMenuData(config) {
  const categories = config.categories || [];
  const tools = config.tools || [];

  const catMap = new Map(categories.map(c => [c, []]));

  tools.forEach(tool => {
    const category = tool.category;
    if (catMap.has(category)) {
      catMap.get(category).push({
        name: tool.name || tool.repo,
        repo: tool.repo
      });
    }
  });

  return Array.from(catMap.entries()).map(([category, tools]) => ({
    category, tools
  }));
}
