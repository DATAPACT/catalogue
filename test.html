<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tools Catalogue</title>
<style>
  body {
    font-family: sans-serif;
    margin: 0;
    display: flex;
  }
  #sidebar {
    width: 250px;
    background-color: #f5f5f5;
    padding: 20px;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    height: 100vh;
    overflow-y: auto;
  }
  #main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }
  ul { list-style: none; padding-left: 0; }
  .category > span { 
    font-weight: bold; 
    margin-top: 10px; 
    display: block; 
  }
  .tool { 
    margin-left: 15px; 
  }
  .tool a { 
    text-decoration: none; 
    color: #333; 
    cursor: pointer; 
    display: block;
    padding: 5px 0;
  }
  .tool a:hover { 
    text-decoration: underline; 
    color: #0070f3; 
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>Tools</h2>
  <nav id="tools-menu"></nav>
</div>

<div id="main">
  <h1>Tools Catalogue</h1>
  <p>Select a tool from the sidebar to see its README.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script>
async function loadConfig() {
  const response = await fetch("config/tools.yml");
  if (!response.ok) throw new Error("Could not fetch tools.yml");
  const yamlText = await response.text();
  return jsyaml.load(yamlText);
}

function buildMenuData(config) {
  const categories = config.categories || [];
  const tools = config.tools || [];
  const catMap = new Map();
  
  // Initialize all categories from YAML
  categories.forEach(cat => catMap.set(cat, []));
  
  // Add tools to their categories
  tools.forEach(tool => {
    if (!tool.repo || !tool.mainfile) return;
    const cat = tool.category || "Uncategorized";
    if (!catMap.has(cat)) catMap.set(cat, []);
    
    catMap.get(cat).push({
      name: tool.name || tool.repo,
      readmePath: `output/${tool.repo}/${tool.mainfile}`
    });
  });

  // Return in fixed category order, filter empty ones
  return categories.map(category => ({
    category,
    tools: catMap.get(category) || []
  })).filter(({tools}) => tools.length > 0);
}

function renderMenu(menuData) {
  const container = document.getElementById("tools-menu");
  container.innerHTML = ""; // Clear existing
  
  const ul = document.createElement("ul");

  menuData.forEach(({ category, tools }) => {
    if (tools.length === 0) return;
    
    // Category container
    const catLi = document.createElement("li");
    catLi.className = "category";

    // Category title (matches CSS selector)
    const title = document.createElement("span");
    title.textContent = category;
    catLi.appendChild(title);

    // Tools list
    const subUl = document.createElement("ul");
    
    tools.forEach(tool => {
      const toolLi = document.createElement("li");
      toolLi.className = "tool";

      const link = document.createElement("a");
      link.href = "#";
      link.textContent = tool.name;
      
      link.addEventListener("click", async (e) => {
        e.preventDefault();
        const main = document.getElementById("main");
        main.innerHTML = `<h2>Loading ${tool.name}...</h2>`;
        
        try {
          const resp = await fetch(tool.readmePath);
          if (resp.ok) {
            main.innerHTML = await resp.text();
          } else {
            main.innerHTML = `
              <h2>${tool.name}</h2>
              <p>Tool not loaded. README not found: ${tool.readmePath}</p>
            `;
          }
        } catch (err) {
          main.innerHTML = `
            <h2>${tool.name}</h2>
            <p>Error loading tool: ${err.message}</p>
          `;
        }
      });

      toolLi.appendChild(link);
      subUl.appendChild(toolLi);
    });
    
    catLi.appendChild(subUl);
    ul.appendChild(catLi);
  });
  
  container.appendChild(ul);
}

// Initialize when page loads
(async function() {
  try {
    console.log("Loading config...");
    const config = await loadConfig();
    console.log("Config loaded:", config.categories?.length, "categories,", config.tools?.length, "tools");
    
    const menuData = buildMenuData(config);
    console.log("Menu data ready:", menuData.length, "categories with tools");
    
    renderMenu(menuData);
    console.log("Menu rendered!");
  } catch (err) {
    console.error("Load error:", err);
    document.getElementById("main").innerHTML = `
      <h2>Error</h2>
      <p>Failed to load tools: ${err.message}</p>
    `;
  }
})();
</script>
</body>
</html>
