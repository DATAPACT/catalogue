<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tools Catalogue</title>
<style>
  body {
    font-family: sans-serif;
    margin: 0;
    display: flex;
  }
  #sidebar {
    width: 250px;
    background-color: #f5f5f5;
    padding: 20px;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    height: 100vh;
    overflow-y: auto;
  }
  #main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }
  ul { list-style: none; padding-left: 0; }
  .category > span { font-weight: bold; margin-top: 10px; display: block; }
  .tool { margin-left: 15px; }
  .tool a { text-decoration: none; color: #333; cursor: pointer; }
  .tool a:hover { text-decoration: underline; color: #0070f3; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>Tools</h2>
  <nav id="tools-menu"></nav>
</div>

<div id="main">
  <h1>Tools Catalogue</h1>
  <p>Select a tool from the sidebar to see its README.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script>
async function loadConfig() {
  const response = await fetch("config/tools.yml");
  if (!response.ok) throw new Error("Could not fetch tools.yml");
  const yamlText = await response.text();
  return jsyaml.load(yamlText);
}

function buildMenuData(config) {
  const categories = config.categories || [];
  const tools = config.tools || [];
  const catMap = new Map();
  categories.forEach(cat => catMap.set(cat, []));

  tools.forEach(tool => {
    if (!tool.repo || !tool.mainfile) return;
    const cat = tool.category || "Uncategorized";
    if (!catMap.has(cat)) catMap.set(cat, []);
    
    catMap.get(cat).push({
      name: tool.name || tool.repo,
      readmePath: `output/${tool.repo}/${tool.mainfile}`  // ✅ EXACTLY what you want
    });
  });

  return Array.from(catMap.entries()).map(([category, tools]) => ({ category, tools }));
}

function renderMenu(menuData) {
  const container = document.getElementById("tools-menu");
  const ul = document.createElement("ul");

  menuData.forEach(({ category, tools }) => {
    if (tools.length === 0) return;
    const catLi = document.createElement("li");
    catLi.className = "category";
    catLi.innerHTML = `<span>${category}</span><ul></ul>`;
    const subUl = catLi.querySelector("ul");

    tools.forEach(tool => {
      const li = document.createElement("li");
      li.className = "tool";
      li.innerHTML = `<a href="#">${tool.name}</a>`;
      li.querySelector("a").addEventListener("click", async (e) => {
        e.preventDefault();
        const main = document.getElementById("main");
        try {
          const resp = await fetch(tool.readmePath);
          main.innerHTML = resp.ok ? await resp.text() : `<p>README not found: ${tool.readmePath}</p>`;
        } catch (err) {
          main.innerHTML = `<p>Error loading ${tool.name}</p>`;
        }
      });
      subUl.appendChild(li);
    });
    ul.appendChild(catLi);
  });
  container.appendChild(ul);
}

// ✅ COMPLETE EXECUTION:
(async function() {
  try {
    const config = await loadConfig();
    const menuData = buildMenuData(config);
    renderMenu(menuData);
  } catch (err) {
    document.getElementById("main").innerHTML = `<p>Error: ${err.message}</p>`;
  }
})();
</script>
