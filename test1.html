<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tools Catalogue</title>
<style>
  body {
    font-family: sans-serif;
    margin: 0;
    display: flex;
  }
  #sidebar {
    width: 250px;
    background-color: #f5f5f5;
    padding: 20px;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    height: 100vh;
    overflow-y: auto;
  }
  #sidebar h2 { margin-top: 0; }
  .home-btn {
    display: block;
    background: #0070f3;
    color: white;
    text-decoration: none;
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 6px;
    text-align: center;
    font-weight: bold;
  }
  .home-btn:hover {
    background: #005bb5;
  }
  #main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }
  ul { list-style: none; padding-left: 0; }
  .category > span { 
    font-weight: bold; 
    margin-top: 10px; 
    display: block; 
  }
  .tool { 
    margin-left: 15px; 
  }
  .tool a { 
    text-decoration: none; 
    color: #333; 
    cursor: pointer; 
    display: block;
    padding: 5px 0;
  }
  .tool a:hover { 
    text-decoration: underline; 
    color: #0070f3; 
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>Tools</h2>
  <a href="#" class="home-btn" onclick="loadHome(); return false;">🏠 Home</a>
  <nav id="tools-menu"></nav>
</div>

<div id="main">
  <!-- home.html content embedded here -->
  <div class="content-card">
    <h1>📋 Datapact Tools Catalogue</h1>
    <p><strong>Welcome!</strong> Browse tools in the sidebar to get started or click a tool name to view its documentation.</p>
    <p>All tools are organized by category. Click the home button above to return to this page anytime.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script>
let homeContent = document.querySelector('#main').innerHTML;

function loadHome() {
  document.getElementById('main').innerHTML = homeContent;
}

async function loadConfig() {
  const response = await fetch("config/tools.yml");
  if (!response.ok) throw new Error("Could not fetch tools.yml");
  const yamlText = await response.text();
  return jsyaml.load(yamlText);
}

function buildMenuData(config) {
  const categories = config.categories || [];
  const tools = config.tools || [];
  const catMap = new Map();
  
  categories.forEach(cat => catMap.set(cat, []));
  
  tools.forEach(tool => {
    if (!tool.repo || !tool.mainfile) return;
    const cat = tool.category || "Uncategorized";
    if (!catMap.has(cat)) catMap.set(cat, []);
    
    catMap.get(cat).push({
      name: tool.name || tool.repo,
      repo: tool.repo,
      readmePath: `output/${tool.repo}/${tool.mainfile}`
    });
  });
